# Ядро кассы и его соседи из исходников.
#
# Узел берёт ядро той версии, что в gradle/libs.versions.toml (superkassaCore),
# ядро — кодек из своего libs.versions.toml (ofdProtoCodec), кодек — протокол
# 2.0.4 из своего (ofdKtProtoV204). В Maven Central их нет; все три собираются
# из исходников и кладутся в локальное хранилище раннера под этими версиями —
# публиковать ради сборки ничего не требуется.
#
# Ветки задаются здесь и только здесь; их берут и проверка, и выпуск. Ядро
# закреплено коммитом: его main ушёл на линию 1.5, а узел стоит на 1.4.4.
# Переходя на другое ядро, узел меняет superkassaCore в libs.versions.toml
# и core-ref ниже вместе.
name: Ядро и соседи из исходников
description: Собирает ofd-kt-proto, ofd-proto-codec и superkassa-core из исходников в локальное хранилище Maven.

inputs:
  ofd-kt-proto-ref:
    description: Ветка или метка texport/ofd-kt-proto
    default: main
  ofd-proto-codec-ref:
    description: Ветка или метка texport/ofd-proto-codec
    default: main
  core-ref:
    description: Ветка, метка или коммит texport/superkassa-core
    default: main

runs:
  using: composite
  steps:
    - name: Протокол
      uses: actions/checkout@v4
      with:
        repository: texport/ofd-kt-proto
        ref: ${{ inputs.ofd-kt-proto-ref }}
        path: .siblings/ofd-kt-proto

    - name: Кодек протокола
      uses: actions/checkout@v4
      with:
        repository: texport/ofd-proto-codec
        ref: ${{ inputs.ofd-proto-codec-ref }}
        path: .siblings/ofd-proto-codec

    - name: Ядро
      uses: actions/checkout@v4
      with:
        repository: texport/superkassa-core
        ref: ${{ inputs.core-ref }}
        path: .siblings/superkassa-core

    # На Linux iOS-цели соседей отключены (kotlin.native.ignoreDisabledTargets),
    # и в хранилище ложатся только JVM и Android — узлу больше не нужно.
    - name: Протокол, кодек и ядро в локальное хранилище
      shell: bash
      run: |
        core=$(sed -n 's/^superkassaCore = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
        codec=$(sed -n 's/^ofdProtoCodec = "\(.*\)"$/\1/p' .siblings/superkassa-core/gradle/libs.versions.toml)
        proto=$(sed -n 's/^ofdKtProtoV204 = "\(.*\)"$/\1/p' .siblings/ofd-proto-codec/gradle/libs.versions.toml)
        test -n "$core" && test -n "$codec" && test -n "$proto" || { echo "::error::Нет версии ядра, кодека или протокола в libs.versions.toml"; exit 1; }
        (cd .siblings/ofd-kt-proto && ./gradlew publishToMavenLocal -PreleaseVersion="$proto")
        (cd .siblings/ofd-proto-codec && ./gradlew publishToMavenLocal -PreleaseVersion="$codec")
        (cd .siblings/superkassa-core && ./gradlew publishToMavenLocal -PreleaseVersion="$core")
