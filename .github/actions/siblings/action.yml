# Ядро кассы и его соседи из исходников.
#
# Узел берёт ядро той версии, что в libs.versions.toml (superkassaCore), а в
# Maven Central её нет; нет там и кодека 1.3.1 с протоколом 2.0.4, на которых
# стоит ядро. Все три собираются из исходников и кладутся в локальное
# хранилище раннера — публиковать ради сборки ничего не требуется.
#
# Ветки или метки задаются здесь и только здесь; их берут и проверка, и
# выпуск. Переходя на другое ядро, узел меняет superkassaCore в
# libs.versions.toml и core-ref ниже — версия в сборке ядра по этой ветке
# должна совпасть с superkassaCore, иначе сборка узла его не найдёт.
name: Ядро и соседи из исходников
description: Собирает ofd-kt-proto, ofd-proto-codec и superkassa-core из исходников в локальное хранилище Maven.

inputs:
  ofd-kt-proto-ref:
    description: Ветка или метка texport/ofd-kt-proto
    default: main
  ofd-proto-codec-ref:
    description: Ветка или метка texport/ofd-proto-codec
    default: main
  core-ref:
    description: Ветка, метка или коммит texport/superkassa-core
    default: main

runs:
  using: composite
  steps:
    - name: Протокол
      uses: actions/checkout@v4
      with:
        repository: texport/ofd-kt-proto
        ref: ${{ inputs.ofd-kt-proto-ref }}
        path: .siblings/ofd-kt-proto

    - name: Кодек протокола
      uses: actions/checkout@v4
      with:
        repository: texport/ofd-proto-codec
        ref: ${{ inputs.ofd-proto-codec-ref }}
        path: .siblings/ofd-proto-codec

    - name: Ядро
      uses: actions/checkout@v4
      with:
        repository: texport/superkassa-core
        ref: ${{ inputs.core-ref }}
        path: .siblings/superkassa-core

    # На Linux iOS-цели соседей отключены (kotlin.native.ignoreDisabledTargets),
    # и в хранилище ложатся только JVM и Android — узлу больше не нужно.
    - name: Протокол в локальное хранилище
      shell: bash
      working-directory: .siblings/ofd-kt-proto
      run: ./gradlew publishToMavenLocal

    - name: Кодек в локальное хранилище
      shell: bash
      working-directory: .siblings/ofd-proto-codec
      run: ./gradlew publishToMavenLocal

    - name: Ядро в локальное хранилище
      shell: bash
      working-directory: .siblings/superkassa-core
      run: ./gradlew publishToMavenLocal
