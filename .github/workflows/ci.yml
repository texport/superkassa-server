# Проверка каждого изменения. Её же вызывает выпуск по метке (release.yml):
# в выпуск уходит только то, что прошло эту проверку.
name: CI Build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    # Узел — JVM-приложение; macOS ему не нужен, а ядро на Linux собирается
    # без iOS-целей и заметно быстрее.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21' # java в libs.versions.toml
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ядро и соседи из исходников
        uses: ./.github/actions/siblings

      # Автоправку detekt на CI выключает сама сборка (по переменной CI):
      # нарушение роняет проверку, а не переписывается молча.
      - name: Run Static Analysis (Detekt)
        run: ./gradlew detekt

      - name: Compile and Assemble Targets
        run: ./gradlew assemble

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Verify Code Coverage Thresholds
        run: ./gradlew jacocoTestCoverageVerification
