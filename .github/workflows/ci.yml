# Проверка каждого изменения. Её же вызывает выпуск (release.yml): в выпуск
# уходит только то, что прошло эту проверку.
#
# Шаги настройки (checkout, Java, Gradle, соседи) — те же, что у библиотек
# и у кассы; дальше — задачи самого узла.
name: CI Build

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    # Узел — JVM-приложение; macOS ему не нужен, а ядро на Linux собирается
    # без iOS-целей и заметно быстрее.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Узел собирается на 21 (java в libs.versions.toml), соседи — на 17
      # (javaTargetCore): их Gradle берёт 17 сам, но с готовым JDK не тратит
      # время на загрузку.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: |
            17
            21
          distribution: 'temurin'

      # Кэш v6 — закрытый компонент gradle-actions-caching: пользуясь им,
      # репозиторий принимает https://gradle.com/legal/terms-of-use/.
      # Условия приняты; отказ от них — cache-provider: basic.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - name: Build Siblings from Sources
        uses: ./.github/actions/siblings

      # Автоправку detekt на CI выключает сама сборка (по переменной CI):
      # нарушение роняет проверку, а не переписывается молча.
      - name: Run Static Analysis (Detekt)
        run: ./gradlew detekt

      - name: Compile and Assemble Targets
        run: ./gradlew assemble

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Verify Code Coverage Thresholds
        run: ./gradlew jacocoTestCoverageVerification
