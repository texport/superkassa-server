server:
  port: 8080

spring:
  application:
    name: superkassa-core
  main:
    banner-mode: console
  jackson:
    serialization:
      fail-on-empty-beans: false

app:
  log-language: RU
  logging:
    pretty-print-json: true

# Интервал воркера offline-очереди (мс). Обрабатывает команды и отправляет в ОФД.
offline-queue:
  worker:
    interval-ms: 5000

# Как часто узел проверяет, не пора ли закрыть смены касс с автозакрытием (мс).
# Ядро закрывает смену за полчаса до предела суток, и минуты хватает с запасом.
shift:
  auto-close:
    interval-ms: 60000

# Как часто узел досылает чеки покупателям по их контактам из чека (мс).
# Задачи доставки живут в базе узла и после перезапуска уходят первым тактом.
receipt-delivery:
  worker:
    interval-ms: 5000

springdoc:
  api-docs:
    enabled: true
    path: /openapi.yaml
  swagger-ui:
    enabled: true
    path: /swagger
    display-request-duration: true
    # Отключаем сортировку тегов на клиенте, чтобы использовать порядок из OpenApiCustomizer
    # Если установить в "alpha", Swagger UI будет сортировать по алфавиту и игнорировать порядок из OpenAPI
    # Оставляем пустым или не указываем, чтобы использовать порядок из спецификации
    operations-sorter: method
    defaultModelsExpandDepth: -1
  # Включаем сохранение порядка ключей в YAML/JSON для правильного порядка тегов
  writer-with-order-by-keys: true
